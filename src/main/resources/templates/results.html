<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recommendations</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="wrap"><a href="/">← Change profile</a><header><span class="eyebrow">TOP CBR MATCHES</span><h1>Your recommended racquets</h1><p>Similarity is normalized when source values are missing. Safety filters are applied before ranking.</p></header>
<section class="results"><article class="card result" th:each="r,stat:${recommendations}"><div class="rank" th:text="${stat.count}">1</div><div><div class="score" th:text="${r.score + '% match · ' + r.confidence + ' confidence'}"></div><h2 th:text="${r.racquet.displayName()}"></h2><p><b>Style:</b> <span th:text="${r.racquet.primaryStyle}"></span> · <b>Level:</b> <span th:text="${r.racquet.playerLevel}"></span> · <b>Pattern:</b> <span th:text="${r.racquet.stringPattern}"></span></p><ul><li th:each="x:${r.reasons}" th:text="${x}"></li></ul><p class="string"><b>Suggested string:</b> <span th:text="${r.racquet.stringType}"></span></p><p class="warning" th:each="x:${r.cautions}" th:text="${x}"></p><details><summary>Expert case summary</summary><p th:text="${r.racquet.summary}"></p></details></div></article></section></main></body></html>
